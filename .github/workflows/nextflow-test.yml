name: Syntax check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: syntax-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-help:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Nextflow
        run: |
          wget -qO- https://get.nextflow.io | bash
          ./nextflow -version
      - name: Pipeline help / manifest
        run: ./nextflow run phage.nf --help

  stub-tests:
    needs: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: end_to_end (all modes)
            run: --end_to_end
          - name: identify
            run: --identify
          - name: annotation
            run: --annotation
          - name: taxonomy
            run: --taxonomy
          - name: prophage
            run: --prophage
          - name: host
            run: --host
          - name: lifecycle
            run: --lifecycle
          - name: combined
            run: --identify --taxonomy --prophage
          - name: deactivate set 1
            run: --identify --dv --ma --mp --pp --sm --vb
          - name: deactivate set 2
            run: --identify --vf --vn --vs --vs2 --ph --sk
          - name: all_tools
            run: --identify --all_tools
    steps:
      - uses: actions/checkout@v4
      - name: Install Nextflow
        run: wget -qO- https://get.nextflow.io | bash
      - name: Stub dry-run
        run: |
          set -o pipefail
          ./nextflow run phage.nf \
            --fasta ./test-data/stub_genome.fasta \
            -profile stub -stub \
            --cores 2 --max_cores 2 \
            ${{ matrix.run }}